<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Screenlands</title>
  <!-- viewport-fit=cover : on dessine jusqu'aux bords, puis on se retire
       nous-mêmes des zones de l'encoche et de la barre d'accueil. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2e3342">
  <!-- Ajouté à l'écran d'accueil de l'iPhone, le jeu s'ouvre en plein écran. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Screenlands">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      /* La couleur des murs : sous l'encoche et la barre d'accueil, le
         bord du jeu se prolonge jusqu'au bord de l'écran. */
      background: #2e3342;
      overflow: hidden;
      /* Pas de défilement, de zoom ni de sélection : l'écran entier est une
         surface de jeu. */
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: fixed;
      top: env(safe-area-inset-top);
      right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game {
      display: block;
      /* Pixel art : pas de lissage à l'agrandissement. */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #joystick {
      position: fixed;
      width: 88px;
      height: 88px;
      margin: -44px 0 0 -44px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
      box-sizing: border-box;
    }
    #joystick[hidden] { display: none; }
    #joystick .arrow {
      position: absolute;
      width: 0;
      height: 0;
      border: 7px solid transparent;
      opacity: 0.35;
    }
    #joystick .arrow.on { opacity: 1; }
    #joystick .arrow.up { left: 50%; top: 4px; margin-left: -7px; border-bottom-color: #f2c44d; border-top-width: 0; }
    #joystick .arrow.down { left: 50%; bottom: 4px; margin-left: -7px; border-top-color: #f2c44d; border-bottom-width: 0; }
    #joystick .arrow.left { top: 50%; left: 4px; margin-top: -7px; border-right-color: #f2c44d; border-left-width: 0; }
    #joystick .arrow.right { top: 50%; right: 4px; margin-top: -7px; border-left-color: #f2c44d; border-right-width: 0; }
    #pause {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 36px);
      left: calc(env(safe-area-inset-left) + 8px);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(10, 12, 18, 0.55);
      color: #c9d1dc;
      font: 700 13px system-ui, sans-serif;
      touch-action: none;
      cursor: pointer;
    }
    #pause[hidden] { display: none; }

    /* --- Menus --- */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(6, 7, 11, 0.82);
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);
      box-sizing: border-box;
    }
    #overlay[hidden] { display: none; }
    #panel {
      width: 100%;
      max-width: 380px;
      max-height: 100%;
      overflow-y: auto;
      /* Le panneau défile au doigt, contrairement au reste de l'écran. */
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      color: #c9d1dc;
      font: 15px system-ui, sans-serif;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }
    #panel h1 {
      margin: 0 0 4px;
      font: 800 34px system-ui, sans-serif;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f2c44d;
    }
    #panel h2 { margin: 0; font: 700 22px system-ui, sans-serif; color: #f2c44d; }
    #panel h3 {
      margin: 0 0 8px;
      font: 700 12px system-ui, sans-serif;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #8f9bad;
      text-align: left;
    }
    #panel .sub { margin: 0 0 28px; color: #8f9bad; }
    #panel .note { margin: 18px 0 0; font-size: 13px; }
    #panel .dim { color: #6f7a8c; }
    #panel .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    #panel .head {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0 10px;
      background: rgba(6, 7, 11, 0.95);
      z-index: 1;
    }
    #panel section {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: #141820;
    }
    #panel .grid { display: flex; flex-wrap: wrap; gap: 6px; }
    #panel .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
      text-align: left;
    }
    #panel .row span { flex: 1; }
    #panel .row b { width: 18px; text-align: center; color: #f2c44d; }
    #panel button {
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #dfe5ee;
      font: 600 14px system-ui, sans-serif;
      cursor: pointer;
    }
    #panel button.big { min-height: 54px; font-size: 18px; }
    #panel button.small { min-width: 40px; padding: 8px; }
    #panel button.primary { background: #f2c44d; border-color: #f2c44d; color: #1a1d26; }
    #panel button.on { border-color: #f2c44d; color: #f2c44d; background: rgba(242, 196, 77, 0.12); }
    #panel button.danger { border-color: #e0524a; color: #ff8a80; }
    #panel button.tier-common { border-color: #b8b2a6; }
    #panel button.tier-rare { border-color: #4fa3ff; color: #8fc3ff; }
    #panel button.tier-epic { border-color: #b36bff; color: #d2a8ff; }
    #panel button.tier-legendary { border-color: #ffc93d; color: #ffd873; }
    #panel .foot { margin-bottom: 8px; }
    #panel .upgrade { padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    #panel .upgrade:last-child { border-bottom: 0; }
    #panel .upgrade b { width: auto; color: #dfe5ee; }
    #panel .upgrade small { color: #8f9bad; }
    #panel .pips { font-style: normal; margin-left: 4px; }
    #panel .pips i { display: inline-block; width: 7px; height: 7px; margin-right: 3px; border-radius: 2px; background: #2a3040; }
    #panel .pips i.on { background: #f2c44d; }
    #panel .gold { color: #f2c44d; }
    #panel button:disabled { opacity: 0.4; cursor: default; }
    #panel .upgrade button { min-width: 74px; }
    #attack {
      position: fixed;
      right: calc(env(safe-area-inset-right) + 22px);
      bottom: calc(env(safe-area-inset-bottom) + 44px);
      width: 76px;
      height: 76px;
      padding: 20px;
      border-radius: 50%;
      border: 2px solid rgba(242, 196, 77, 0.55);
      background: rgba(242, 196, 77, 0.12);
      color: rgba(242, 196, 77, 0.9);
      touch-action: none;
      cursor: pointer;
      box-sizing: border-box;
    }
    #attack[hidden] { display: none; }
    #attack.pressed { background: rgba(242, 196, 77, 0.35); }
    #attack svg { display: block; width: 100%; height: 100%; }
    #attack:focus { outline: none; }
    #joystick .knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>
  <!-- Le joystick : quatre flèches, dont s'allume celle que le pouce vise. -->
  <div id="joystick" hidden>
    <div class="arrow up"></div><div class="arrow down"></div>
    <div class="arrow left"></div><div class="arrow right"></div>
    <div class="knob"></div>
  </div>
  <!-- La pause, en haut à gauche ; au bac à sable, elle ouvre les outils. -->
  <button id="pause" type="button" aria-label="Pause" hidden>II</button>
  <!-- Les menus (menu.js) : principal, pause, bac à sable. -->
  <div id="overlay" hidden><div id="panel"></div></div>
  <!-- Le bouton d'attaque, sous le pouce droit ; le joystick apparaît
       partout ailleurs. Caché tant qu'on n'a pas trouvé d'arme ; son icône
       est celle de l'arme en main (main.js). -->
  <button id="attack" type="button" aria-label="Attaquer" hidden></button>

  <!-- Scripts classiques, sans module ni outil de compilation : le jeu
       s'ouvre aussi bien en double-cliquant sur ce fichier que depuis
       GitHub Pages. L'ordre compte. -->
  <script src="src/config.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/random.js"></script>
  <script src="src/zones.js"></script>
  <script src="src/generator.js"></script>
  <script src="src/items.js"></script>
  <script src="src/stats.js"></script>
  <script src="src/powers.js"></script>
  <script src="src/loot.js"></script>
  <script src="src/nav.js"></script>
  <script src="src/enemies.js"></script>
  <script src="src/save.js"></script>
  <script src="src/upgrades.js"></script>
  <script src="src/input.js"></script>
  <script src="src/weapons.js"></script>
  <script src="src/allies.js"></script>
  <script src="src/world.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/sound.js"></script>
  <script src="src/scenery.js"></script>
  <script src="src/render.js"></script>
  <script src="src/menu.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
