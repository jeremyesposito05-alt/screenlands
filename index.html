<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Screenlands</title>
  <!-- viewport-fit=cover : on dessine jusqu'aux bords, puis on se retire
       nous-mêmes des zones de l'encoche et de la barre d'accueil. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <!-- Ajouté à l'écran d'accueil de l'iPhone, le jeu s'ouvre en plein écran. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Screenlands">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0d12;
      overflow: hidden;
      /* Pas de défilement, de zoom ni de sélection : l'écran entier est une
         surface de jeu. */
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: fixed;
      top: env(safe-area-inset-top);
      right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game {
      display: block;
      /* Pixel art : pas de lissage à l'agrandissement. */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #joystick {
      position: fixed;
      width: 96px;
      height: 96px;
      margin: -48px 0 0 -48px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
      box-sizing: border-box;
    }
    #joystick[hidden] { display: none; }
    #attack {
      position: fixed;
      right: calc(env(safe-area-inset-right) + 22px);
      bottom: calc(env(safe-area-inset-bottom) + 44px);
      width: 76px;
      height: 76px;
      padding: 20px;
      border-radius: 50%;
      border: 2px solid rgba(242, 196, 77, 0.55);
      background: rgba(242, 196, 77, 0.12);
      color: rgba(242, 196, 77, 0.9);
      touch-action: none;
      cursor: pointer;
      box-sizing: border-box;
    }
    #attack.pressed { background: rgba(242, 196, 77, 0.35); }
    #attack svg { display: block; width: 100%; height: 100%; }
    #attack:focus { outline: none; }
    #joystick .knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="joystick" hidden><div class="knob"></div></div>
  <!-- Le bouton d'attaque, sous le pouce droit ; le joystick apparaît
       partout ailleurs. -->
  <button id="attack" type="button" aria-label="Attaquer">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19 3 L21 5 L10 16 L8 14 Z" fill="currentColor"/>
      <path d="M6 12 L12 18 L10.5 19.5 L4.5 13.5 Z" fill="currentColor"/>
      <path d="M7.5 16.5 L4 20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Scripts classiques, sans module ni outil de compilation : le jeu
       s'ouvre aussi bien en double-cliquant sur ce fichier que depuis
       GitHub Pages. L'ordre compte. -->
  <script src="src/config.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/zones.js"></script>
  <script src="src/enemies.js"></script>
  <script src="src/save.js"></script>
  <script src="src/input.js"></script>
  <script src="src/world.js"></script>
  <script src="src/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
