<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Screenlands</title>
  <!-- viewport-fit=cover : on dessine jusqu'aux bords, puis on se retire
       nous-mêmes des zones de l'encoche et de la barre d'accueil. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <!-- Ajouté à l'écran d'accueil de l'iPhone, le jeu s'ouvre en plein écran. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Screenlands">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0d12;
      overflow: hidden;
      /* Pas de défilement, de zoom ni de sélection : l'écran entier est une
         surface de jeu. */
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: fixed;
      top: env(safe-area-inset-top);
      right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game {
      display: block;
      /* Pixel art : pas de lissage à l'agrandissement. */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #joystick {
      position: fixed;
      width: 88px;
      height: 88px;
      margin: -44px 0 0 -44px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
      box-sizing: border-box;
    }
    #joystick[hidden] { display: none; }
    #joystick .arrow {
      position: absolute;
      width: 0;
      height: 0;
      border: 7px solid transparent;
      opacity: 0.35;
    }
    #joystick .arrow.on { opacity: 1; }
    #joystick .arrow.up { left: 50%; top: 4px; margin-left: -7px; border-bottom-color: #f2c44d; border-top-width: 0; }
    #joystick .arrow.down { left: 50%; bottom: 4px; margin-left: -7px; border-top-color: #f2c44d; border-bottom-width: 0; }
    #joystick .arrow.left { top: 50%; left: 4px; margin-top: -7px; border-right-color: #f2c44d; border-left-width: 0; }
    #joystick .arrow.right { top: 50%; right: 4px; margin-top: -7px; border-left-color: #f2c44d; border-right-width: 0; }
    #controls {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 64px);
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid rgba(169, 139, 240, 0.6);
      background: rgba(20, 16, 34, 0.85);
      color: #d9ccff;
      font: 14px system-ui, sans-serif;
      touch-action: none;
      cursor: pointer;
    }
    #controls[hidden] { display: none; }
    #attack {
      position: fixed;
      right: calc(env(safe-area-inset-right) + 22px);
      bottom: calc(env(safe-area-inset-bottom) + 44px);
      width: 76px;
      height: 76px;
      padding: 20px;
      border-radius: 50%;
      border: 2px solid rgba(242, 196, 77, 0.55);
      background: rgba(242, 196, 77, 0.12);
      color: rgba(242, 196, 77, 0.9);
      touch-action: none;
      cursor: pointer;
      box-sizing: border-box;
    }
    #attack[hidden] { display: none; }
    #attack.pressed { background: rgba(242, 196, 77, 0.35); }
    #attack svg { display: block; width: 100%; height: 100%; }
    #attack:focus { outline: none; }
    #joystick .knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>
  <!-- Le joystick : quatre flèches, dont s'allume celle que le pouce vise. -->
  <div id="joystick" hidden>
    <div class="arrow up"></div><div class="arrow down"></div>
    <div class="arrow left"></div><div class="arrow right"></div>
    <div class="knob"></div>
  </div>
  <!-- Le choix des commandes, au camp de base seulement : ailleurs, on ne
       veut pas le toucher par mégarde en pleine course. -->
  <button id="controls" type="button" hidden></button>
  <!-- Le bouton d'attaque, sous le pouce droit ; le joystick apparaît
       partout ailleurs. Caché tant qu'on n'a pas trouvé d'arme ; son icône
       est celle de l'arme en main (main.js). -->
  <button id="attack" type="button" aria-label="Attaquer" hidden></button>

  <!-- Scripts classiques, sans module ni outil de compilation : le jeu
       s'ouvre aussi bien en double-cliquant sur ce fichier que depuis
       GitHub Pages. L'ordre compte. -->
  <script src="src/config.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/random.js"></script>
  <script src="src/zones.js"></script>
  <script src="src/generator.js"></script>
  <script src="src/items.js"></script>
  <script src="src/stats.js"></script>
  <script src="src/powers.js"></script>
  <script src="src/loot.js"></script>
  <script src="src/nav.js"></script>
  <script src="src/enemies.js"></script>
  <script src="src/save.js"></script>
  <script src="src/input.js"></script>
  <script src="src/weapons.js"></script>
  <script src="src/world.js"></script>
  <script src="src/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
